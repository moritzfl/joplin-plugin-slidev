name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18
          cache: npm
      - run: npm install --global npm@11.16.0
      - run: npm ci
      - run: npm test
      - run: npm run tsc
      - run: npm run dist
      - run: npm run verify-package
